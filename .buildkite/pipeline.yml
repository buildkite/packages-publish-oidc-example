steps:
  - key: "h1-security-test"
    label: ":lock: H1 Security Test - Fork PoC"
    command: "echo 'H1-FORK-POC-2026-04-01: This step was injected from a fork PR pipeline.yml by @zephrfish for HackerOne report. No malicious action taken.'"

  - key: "clean"
    label: ":broom: Clean"
    command: ".buildkite/clean.sh"

  - key: "build"
    label: ":hammer_and_wrench: Build"
    command: "dpkg-deb --build hello-buildkite-1.0"
    artifact_paths: "*.deb"
    depends_on: "clean"

  - label: ":debian: Publish"
    depends_on: "build"
    plugins:
      - publish-to-packages#v2.1.0:
          artifacts: "*.deb"
          registry: "buildkite/oidc-example"
